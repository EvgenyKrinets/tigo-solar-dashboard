name: Release HACS version

on:
  push:
    branches: [main]
    paths:
      - custom_components/tigo_solar_dashboard/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('custom_components/tigo_solar_dashboard/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create tag and GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
          else
            gh release create "$TAG" --target "${GITHUB_SHA}" --title "Tigo Solar Dashboard $TAG" --generate-notes
          fi
